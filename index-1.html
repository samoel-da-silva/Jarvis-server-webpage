<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>luisontopofthepiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2ECDD;
    --card: #FBF7EE;
    --ink: #22231F;
    --ink-soft: #55534A;
    --line: #D9CFB3;
    --stamp: #A83A24;
    --stamp-soft: #E9D9C9;
    --ok: #3E6E5E;
    --ok-bg: #DEE9E0;
    --off: #A3401F;
    --off-bg: #F3DED2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    padding: 32px 18px 80px;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 30px;
  }

  .tab {
    display: inline-block;
    background: var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    padding: 4px 10px;
    border-radius: 3px 3px 0 0;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    margin: 0 0 6px;
    line-height: 1.1;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  #clock { font-variant-numeric: tabular-nums; }

  .stack { display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
    box-shadow: 2px 2px 0 rgba(34,35,31,0.05);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .card:nth-child(3n+1) { transform: rotate(-0.4deg); }
  .card:nth-child(3n+2) { transform: rotate(0.3deg); }
  .card:nth-child(3n)   { transform: rotate(-0.15deg); }

  .card:hover {
    transform: rotate(0deg) translateY(-2px);
    box-shadow: 3px 4px 0 rgba(34,35,31,0.09);
  }

  .badge {
    width: 42px;
    height: 42px;
    border-radius: 3px;
    background: var(--stamp-soft);
    color: var(--stamp);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    flex-shrink: 0;
  }

  .card-body { flex: 1; min-width: 0; }

  .card-name {
    font-weight: 500;
    font-size: 16px;
    margin: 0 0 3px;
  }

  .card-addr {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    flex-shrink: 0;
    padding: 3px 8px;
    border-radius: 20px;
  }

  .status.checking { color: var(--ink-soft); }
  .status.online { color: var(--ok); background: var(--ok-bg); }
  .status.offline { color: var(--off); background: var(--off-bg); }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-soft);
    border: 1px dashed var(--line);
    border-radius: 3px;
  }

  .empty p:first-child {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    color: var(--ink);
    margin: 0 0 8px;
  }

  .empty code {
    font-family: 'IBM Plex Mono', monospace;
    background: var(--card);
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid var(--line);
  }

  footer {
    margin-top: 34px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="tab">luisontopofthepiles</span>
    <h1>Servidor do colégio</h1>
    <p>Acesso rápido às interfaces web dos serviços deste servidor.</p>
    <div class="meta-row">
      <span id="clock">--:--:--</span>
      <span id="count"></span>
    </div>
  </header>

  <div id="stack" class="stack"></div>
</div>

<script>
  /* ================================================================
     EDITE AQUI: adicione um objeto pra cada serviço/app do servidor.
     - name: nome que aparece no card
     - url:  endereço completo, com http:// ou https:// e a porta
     Exemplos comuns de porta padrão (ajuste pro seu servidor):
       Jellyfin      -> :8096
       qBittorrent   -> :8080
       Portainer     -> :9000
       Paperless-ngx -> :8000
     Se não souber o IP/hostname do servidor, roda "hostname -I"
     nele que o comando mostra o IP local pra você usar aqui.
  ================================================================ */
  const SERVICES = [
    { name: "Jellyfin",    url: "http://10.217.194.89:8096" },
    { name: "qBittorrent", url: "http://10.217.194.89:8080" },
  ];
  /* ================================================================ */

  const stackEl = document.getElementById('stack');
  const countEl = document.getElementById('count');

  function initials(name) {
    const parts = name.trim().split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  function hostPort(url) {
    try {
      const u = new URL(url);
      return u.host;
    } catch (e) {
      return url;
    }
  }

  function render() {
    if (SERVICES.length === 0) {
      stackEl.innerHTML = `
        <div class="empty">
          <p>Nenhum serviço cadastrado ainda</p>
          <p>Abra o arquivo <code>index.html</code> e edite a lista <code>SERVICES</code>
          no script, adicionando nome e endereço de cada app do servidor.</p>
        </div>`;
      countEl.textContent = '';
      return;
    }

    countEl.textContent = SERVICES.length + (SERVICES.length === 1 ? ' serviço' : ' serviços');

    stackEl.innerHTML = SERVICES.map((s, i) => `
      <a class="card" href="${s.url}" target="_blank" rel="noopener">
        <div class="badge">${initials(s.name)}</div>
        <div class="card-body">
          <p class="card-name">${s.name}</p>
          <p class="card-addr">${hostPort(s.url)}</p>
        </div>
        <span class="status checking" data-idx="${i}">
          <span class="dot"></span><span class="label">checando</span>
        </span>
      </a>
    `).join('');

    SERVICES.forEach((s, i) => checkStatus(s.url, i));
  }

  function checkStatus(url, idx) {
    const el = document.querySelector(`.status[data-idx="${idx}"] .label`);
    const wrap = document.querySelector(`.status[data-idx="${idx}"]`);
    if (!el || !wrap) return;

    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2500));

    Promise.race([fetch(url, { mode: 'no-cors' }), timeout])
      .then(() => {
        wrap.className = 'status online';
        el.textContent = 'online';
      })
      .catch(() => {
        wrap.className = 'status offline';
        el.textContent = 'offline';
      });
  }

  function updateClock() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  updateClock();
  setInterval(updateClock, 1000);

  render();
</script>

<div class="wrap">
  <footer>Página estática — não depende de backend. Salve este arquivo direto no servidor e sirva com qualquer servidor HTTP simples.</footer>
</div>

</body>
</html>
